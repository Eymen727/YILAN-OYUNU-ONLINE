<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yılan Oyunu - Çok Oyunculu Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Mobil Kontrolleri -->
        <div id="mobile-controls" style="position: fixed; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 100; display: none;">
            <!-- D-Pad -->
            <div id="dpad" style="width: 120px; height: 120px; position: relative;">
                <button id="btn-up" style="position: absolute; top: 0; left: 40px; width: 40px; height: 40px; background-color: rgba(76, 175, 80, 0.7); color: white; border: none; border-radius: 5px; font-size: 20px; cursor: pointer;">▲</button>
                <button id="btn-left" style="position: absolute; top: 40px; left: 0; width: 40px; height: 40px; background-color: rgba(76, 175, 80, 0.7); color: white; border: none; border-radius: 5px; font-size: 20px; cursor: pointer;">◄</button>
                <button id="btn-down" style="position: absolute; top: 80px; left: 40px; width: 40px; height: 40px; background-color: rgba(76, 175, 80, 0.7); color: white; border: none; border-radius: 5px; font-size: 20px; cursor: pointer;">▼</button>
                <button id="btn-right" style="position: absolute; top: 40px; left: 80px; width: 40px; height: 40px; background-color: rgba(76, 175, 80, 0.7); color: white; border: none; border-radius: 5px; font-size: 20px; cursor: pointer;">►</button>
            </div>
            <!-- Pause Butonu -->
            <button id="btn-pause" style="width: 120px; height: 40px; background-color: rgba(255, 215, 0, 0.7); color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer;">⏸</button>
        </div>
        
        <div id="ui-layer">
            <div style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap;">
                <div id="score" style="padding: 10px; background-color: rgba(0, 0, 0, 0.5); border-radius: 5px;">Skor: 0 Puan</div>
                <div id="player-name-container" style="display: flex; gap: 10px; align-items: center;">
                    <span id="player-name-display" style="cursor: pointer; padding: 10px; background-color: rgba(76, 175, 80, 0.3); border-radius: 5px; border: 2px solid #4CAF50; min-width: 200px;">İsim: Belirleniyor...</span>
                </div>
            </div>
            <div id="players-list">
                <h3>Oyuncular</h3>
                <div id="players-container"></div>
            </div>
        </div>

        <div id="connection-status">
            <span id="status-text">Bağlanılıyor...</span>
        </div>

        <div id="game-over-screen" class="hidden">
            <div style="color: #FF6B6B; font-size: 36px; margin-bottom: 20px;">✗ ÖLDÜN!</div>
            <div style="margin-bottom: 20px;">Final Skor: <span id="final-score">0</span></div>
            <div style="font-size: 16px; color: #888;">Yeniden başlamak için tıkla</div>
        </div>

        <div id="pause-screen" class="hidden">
            <div style="color: #FFD700; font-size: 36px; margin-bottom: 20px;">⏸ DURDURULDU</div>
            <div style="font-size: 16px; color: #888;">Devam etmek için P'ye bas veya tıkla</div>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div id="modal-overlay" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.7); display: none; z-index: 999;"></div>

    <!-- Name Change Modal -->
    <div id="name-modal" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: rgba(0, 0, 0, 0.95); padding: 30px; border-radius: 10px; display: none; z-index: 1001; text-align: center; border: 2px solid #4CAF50; min-width: 300px;">
        <div style="margin-bottom: 20px; font-size: 20px; color: #4CAF50; font-weight: bold;">Yeni İsim Gir</div>
        <input type="text" id="name-input-modal" style="padding: 10px; border-radius: 5px; border: 2px solid #4CAF50; width: 100%; font-size: 16px; box-sizing: border-box; margin-bottom: 20px; color: #000;" placeholder="İsmin...">
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button id="name-save-btn" style="padding: 10px 20px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px;">Kaydet</button>
            <button id="name-cancel-btn" style="padding: 10px 20px; background-color: #666; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px;">İptal</button>
        </div>
    </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
